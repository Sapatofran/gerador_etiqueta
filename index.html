<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Etiquetas | Sapatofran</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        @import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css");

        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        .sub {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        .painel {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--bg);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
        }

        input, textarea {
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 1rem;
            transition: all 0.2s;
            background: #fff;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            font-size: 0.95rem;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: rgba(37, 99, 235, 0.05);
        }

        .tamanhos-box {
            margin-top: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 1rem;
            padding: 1.5rem;
            background: #f8fafc;
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }

        .tamanho-item {
            background: white;
            border-radius: 8px;
            padding: 0.75rem;
            border: 1px solid var(--border);
            text-align: center;
        }

        .tamanho-item h3 {
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .tamanho-item input {
            width: 100%;
            text-align: center;
            padding: 0.5rem;
        }

        /* Estilo das Etiquetas (Otimizado para Impressão) */
        .etiquetas {
            display: flex;
            flex-direction: column;
            gap: 40px;
            align-items: center;
            margin-top: 3rem;
        }

        .etiqueta {
            width: 100%;
            max-width: 800px;
            background: white;
            border: 2px solid #000;
            padding: 30px;
            position: relative;
            page-break-inside: avoid;
            color: #000;
        }

        .topo-etq {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #000;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .nfe {
            font-size: 32px;
            font-weight: 900;
        }

        .numero {
            font-size: 24px;
            font-weight: 700;
        }

        .linha {
            display: grid;
            grid-template-columns: 140px 1fr;
            margin-bottom: 15px;
            align-items: baseline;
        }

        .tag {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .valor {
            font-size: 18px;
            font-weight: 500;
        }

        .sku-valor {
            font-size: 24px;
            font-weight: 800;
        }

        .volume-box {
            margin-top: 30px;
            border: 4px solid #000;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 42px;
            font-weight: 900;
            background: #000;
            color: #fff;
        }

        .volume-box span:first-child {
            font-size: 24px;
            font-weight: 700;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .painel, header {
                display: none;
            }
            .container {
                max-width: 100%;
            }
            .etiquetas {
                margin-top: 0;
                gap: 0;
            }
            .etiqueta {
                border: 2px solid #000;
                margin-bottom: 0;
                page-break-after: always;
            }
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Gerador de Etiquetas - Sapatofran</h1>
    </header>

    <div class="painel">
        <div class="section-title">Informações do Produto</div>
        <div class="grid">
            <div class="campo">
                <label><i class="bi bi-upc"></i> SKU Base</label>
                <input type="text" id="sku" placeholder="Ex: E-4093-AREIA">
            </div>
            <div class="campo">
                <label><i class="bi bi-person"></i> Cliente</label>
                <input type="text" id="cliente" placeholder="Nome do cliente">
            </div>
            <div class="campo">
                <label><i class="bi bi-building"></i> Cidade</label>
                <input type="text" id="cidade" value="Extrema" placeholder="Cidade de destino">
            </div>
            <div class="campo">
                <label><i class="bi bi-palette"></i> Cor</label>
                <input type="text" id="cor" placeholder="Cor do item">
            </div>
        </div>

        <div class="campo">
            <label><i class="bi bi-card-text"></i> Descrição do Produto</label>
            <textarea id="descricao" placeholder="Descrição do produto"></textarea>
        </div>

        <div class="section-title" style="margin-top: 2.5rem;">Grade de Tamanhos</div>
        <div class="grid" style="grid-template-columns: 1fr 1fr;">
            <div class="campo">
                <label>Numeração Inicial</label>
                <input type="number" id="inicio" value="34">
            </div>
            <div class="campo">
                <label>Numeração Final</label>
                <input type="number" id="fim" value="40">
            </div>
        </div>

        <button class="btn btn-secondary" style="width: 100%;" onclick="gerarCampos()">
            <i class="bi bi-arrow-repeat"></i> ATUALIZAR GRADE DE TAMANHOS
        </button>

        <div class="tamanhos-box" id="tamanhosBox">
            <!-- Gerado via JS -->
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="gerarEtiquetas()">
                <i class="bi bi-tags"></i> GERAR ETIQUETAS
            </button>
            <button class="btn btn-outline" onclick="window.print()">
               <i class="bi bi-printer"></i> IMPRIMIR / PDF
            </button>
        </div>
    </div>

    <div class="etiquetas" id="etiquetas">
        <!-- Etiquetas aparecerão aqui -->
    </div>
</div>

<script>
    function gerarCampos() {
        const inicio = parseInt(document.getElementById("inicio").value);
        const fim = parseInt(document.getElementById("fim").value);
        const box = document.getElementById("tamanhosBox");

        if (isNaN(inicio) || isNaN(fim) || inicio > fim) {
            alert("Por favor, insira um intervalo de numeração válido.");
            return;
        }

        box.innerHTML = "";
        for (let i = inicio; i <= fim; i++) {
            box.innerHTML += `
                <div class="tamanho-item">
                    <h3>Tam. ${i}</h3>
                    <input type="number" id="tam-${i}" value="0" min="0">
                </div>
            `;
        }
    }

    function gerarEtiquetas() {
        const etiquetasContainer = document.getElementById("etiquetas");
        etiquetasContainer.innerHTML = "";

        const skuBase = document.getElementById("sku").value;
        const cliente = document.getElementById("cliente").value;
        const cidade = document.getElementById("cidade").value;
        const cor = document.getElementById("cor").value;
        const descricao = document.getElementById("descricao").value;
        const inicio = parseInt(document.getElementById("inicio").value);
        const fim = parseInt(document.getElementById("fim").value);

        let volumes = [];

        for (let tamanho = inicio; tamanho <= fim; tamanho++) {
            const input = document.getElementById(`tam-${tamanho}`);
            if (input) {
                const qtd = parseInt(input.value) || 0;
                for (let i = 0; i < qtd; i++) {
                    volumes.push({
                        tamanho,
                        sku: `${skuBase}-${tamanho}`
                    });
                }
            }
        }

        if (volumes.length === 0) {
            alert("Adicione pelo menos uma quantidade na grade para gerar etiquetas.");
            return;
        }

        const total = volumes.length;

        volumes.forEach((item, index) => {
            etiquetasContainer.innerHTML += `
                <div class="etiqueta">
                    <div class="topo-etq">
                        <div class="nfe">NF-e</div>
                        <div class="numero">Nº 1</div>
                    </div>

                    <div class="linha">
                        <div class="tag">Seller:</div>
                        <div class="valor">Sapatofran Comercio de Calcados e Servicos de Logistica</div>
                    </div>

                    <div class="linha">
                        <div class="tag">Cliente:</div>
                        <div class="valor">${cliente}</div>
                    </div>

                    <div class="linha">
                        <div class="tag">Cidade:</div>
                        <div class="valor">${cidade}</div>
                    </div>

                    <div class="linha">
                        <div class="tag">Sku Seller:</div>
                        <div class="valor sku-valor">${item.sku}</div>
                    </div>

                    <div class="linha">
                        <div class="tag">Cor:</div>
                        <div class="valor">${cor}</div>
                    </div>

                    <div class="linha">
                        <div class="tag">Descrição:</div>
                        <div class="valor">${descricao}</div>
                    </div>

                    <div class="volume-box">
                        <span>VOLUME</span>
                        <span>${index + 1} / ${total}</span>
                    </div>
                </div>
            `;
        });

        // Scroll suave até as etiquetas
        etiquetasContainer.scrollIntoView({ behavior: 'smooth' });
    }

    // Inicializa a grade ao carregar
    window.onload = gerarCampos;
</script>

</body>
</html>
